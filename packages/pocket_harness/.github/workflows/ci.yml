name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Verify zero Flutter dependencies (iron rule)
        run: |
          if grep -qE '^\s+flutter|sdk:\s*flutter' pubspec.yaml; then
            echo "::error::Flutter dependency detected — forbidden by package iron rule"; exit 1
          fi
          if grep -rqE "import '(package:flutter/|dart:ui)" lib/ example/; then
            echo "::error::Flutter import detected in lib/ or example/"; exit 1
          fi

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run tests
        run: dart test
